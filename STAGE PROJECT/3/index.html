<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Gameplay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-panel">

    <div class="score-bar">
        <div class="score-item">
            <span>SCORE:</span>
            <strong>0</strong>
        </div>

        <div class="divider"></div>

        <div class="score-item">
            <span>BEST:</span>
            <strong>0</strong>
        </div>

        <button class="pause">PAUSE</button>
    </div>

    <div class="game-content">

        <div class="board">
            <div class="food"></div>

            <div class="snake">
                <div class="segment head">
                    <span class="eye eye1"></span>
                    <span class="eye eye2"></span>
                    <span class="mouth"></span>
                </div>

                <div class="segment s1"></div>
                <div class="segment s2"></div>
                <div class="segment s3"></div>
                <div class="segment s4"></div>
                <div class="segment s5"></div>
                <div class="segment s6"></div>
                <div class="segment s7"></div>
                <div class="segment s8"></div>

                <div class="segment vertical v1"></div>
                <div class="segment vertical v2"></div>
                <div class="segment vertical v3"></div>
                <div class="segment vertical v4"></div>
                <div class="segment vertical v5"></div>

                <div class="segment bottom b1"></div>
                <div class="segment bottom b2"></div>
                <div class="segment bottom b3"></div>
                <div class="segment bottom b4"></div>
            </div>
        </div>

        <div class="controls">
            <h2>CONTROLS</h2>

            <div class="arrow up">↑</div>

            <div class="arrow-row">
                <div class="arrow">←</div>
                <div class="arrow">↓</div>
                <div class="arrow">→</div>
            </div>

            <p class="instruction">Use arrow keys to move</p>

            <div class="commands">
                <div>
                    <span>P</span>
                    <label>- &nbsp; Pause</label>
                </div>

                <div>
                    <span>R</span>
                    <label>- &nbsp; Restart</label>
                </div>

                <div>
                    <span>Esc</span>
                    <label>- &nbsp; Menu</label>
                </div>
            </div>
        </div>

    </div>

</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const difficulty = params.get('difficulty') || 'medium';
        console.log('Playing on difficulty:', difficulty);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.location.href = '../1/index.html';
            }
        });
    </script>

</body>
</html>
